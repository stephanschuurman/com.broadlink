<style></style>

<form class="homey-form">
   <fieldset class="homey-form-fieldset">

      <p data-i18n="pair.tip" style="padding: 1rem 0 0 0;"></p>

      <div class="homey-form-group">
         <fieldset class="homey-form-radio-set">
            <legend class="homey-form-radio-set-title" data-i18n="repair.discovery_options"></legend>

            <label class="homey-form-radio">
               <input class="homey-form-radio-input" type="radio" name="discoveryOptions" id="radio-automatic"
                  value="automatic" checked />
               <span class="homey-form-radio-checkmark"></span>
               <span class="homey-form-radio-text" data-i18n="repair.automatic">Automatic</span>
            </label>

            <label class="homey-form-radio">
               <input class="homey-form-radio-input" type="radio" name="discoveryOptions" id="radio-manual"
                  value="manual" />
               <span class="homey-form-radio-checkmark"></span>
               <span class="homey-form-radio-text" data-i18n="repair.manual">Manual</span>
            </label>

            <div id="group_manual">
               <label for="address" data-i18n="repair.address"></label>
               <input type="text" class="form-control" id="address" placeholder="0.0.0.0">
            </div>

         </fieldset>
      </div>

      <div class="homey-form-group" style="padding: 1rem 0;">
         <button type="button" class="homey-button-primary-full" id="applyBtn" data-i18n="repair.apply"></button>
      </div>

   </fieldset>
</form>

<div class="messages" style="padding-top: 1rem; color: #ff6300;">
   <span id="broadlink-error"></span>
</div>

<script type="application/javascript">

   const TIMEOUT_MS = 1000; // Discovery timeout in milliseconds
   const radios = document.querySelectorAll('input[name="discoveryOptions"]');
   const addressInput = document.getElementById('address');
   const applyButton = document.getElementById('applyBtn');
   const errorMessage = document.getElementById('broadlink-error');
   let homeyIp = '';

   // If statement for local testing without Homey
   if (typeof Homey !== "undefined") {
      Homey.setTitle(Homey.__("pair.title"));
   }

   function getDiscoveryMode() {
      return document.querySelector('input[name="discoveryOptions"]:checked')?.value || 'automatic';
   }

   async function syncDiscoveryUi() {
      const mode = getDiscoveryMode();
      const isManual = mode === 'manual';
      addressInput.disabled = !isManual;
      if (isManual) {
         addressInput.focus();
      } else {
         addressInput.value = homeyIp ? homeyIp.split('.').slice(0, 3).join('.') + '.' : '';
      }
   }

   function isValidIPv4(ip) {
      const regex = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
      return regex.test(ip);
   }

   function escapeHtml(value) {
      return String(value)
         .replace(/&/g, '&amp;')
         .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;')
         .replace(/"/g, '&quot;')
         .replace(/'/g, '&#39;');
   }

   function renderDiscoveryError(mode, devices) {
      const baseMessage = Homey.__(mode === 'manual' ? 'pair.error_no_discover' : 'pair.auto_discover_failed');
      if (!Array.isArray(devices) || devices.length === 0) {
         errorMessage.textContent = baseMessage;
         return;
      }

      const items = devices
         .map((device) => {
            const name = escapeHtml(device?.device?.data?.name || device?.device?.name || 'Unknown');
            const type = escapeHtml(`0x${device?.typeName || '?'}`);
            return `<li style="padding: 5px;">${Homey.__("pair.found_another", { dev: name, type })}</li>`;
         })
         .join('');

      errorMessage.innerHTML = `<span>${escapeHtml(baseMessage)}</span><br><br><ul style="">${items}</ul>`;
   }

   async function applyPairSettings() {
      const mode = getDiscoveryMode();
      const ipAddress = addressInput.value.trim();

      errorMessage.textContent = '';
      applyButton.classList.add('is-loading');

      if (mode === 'manual' && !isValidIPv4(ipAddress)) {
         if (typeof Homey !== 'undefined') {
            await Homey.alert(Homey.__('pair.invalid_ipaddress'));
         }
         addressInput.focus();
         applyButton.classList.remove('is-loading');
         return;
      }

      try {
         const discoveredDevices = await Homey.emit('start_discover', { address: mode === 'manual' ? ipAddress : null, timeout: TIMEOUT_MS }, null) || [];
         applyButton.classList.remove('is-loading');

         if (discoveredDevices.filter((d) => d.isLocked).length > 0) {
            await Homey.alert(Homey.__('pair.error_device_locked'));
         }

         if (discoveredDevices.filter((d) => d.isCompatible).length > 0) {
            Homey.showView('list_devices');
         } else if (discoveredDevices.filter((d) => d.isCompatible).length === 0) {
            renderDiscoveryError(mode, discoveredDevices);
         } else {
            errorMessage.textContent = Homey.__(mode === 'manual' ? 'pair.error_no_discover' : 'pair.auto_discover_failed');
         }
      } catch (err) {
         if (typeof Homey !== 'undefined') {
            await Homey.alert(err.message);
         } else {
            alert(err.message);
         }
      }
   }

   // Add event listeners to radio buttons
   radios.forEach((radio) => {
      radio.addEventListener('change', syncDiscoveryUi);
   });

   applyButton.addEventListener('click', applyPairSettings);

   void syncDiscoveryUi();

   // Load Homey's IP address asynchronously as possible to pre-fill the manual input and speed up discovery
   Homey.emit('get_homey_ip').then(ip => {
      homeyIp = ip;
      syncDiscoveryUi();
    }).catch(() => {});

</script>
